url: https://peteowen1.github.io/canalysis/

template:
  bootstrap: 5

reference:
  - title: Pipeline
    desc: Run the full analysis
    contents:
      - rank_uk_cities_by_canals
      - setup_uk_bbox
      - fetch_uk_canals
      - fetch_uk_cities
      - get_city_admin_polygons

  - title: Metrics
    desc: Compute canal and connectivity metrics
    contents:
      - calculate_canal_metrics
